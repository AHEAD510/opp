<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タビマエ・インバウンド</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900">

  <!-- Header -->
  <header class="absolute top-0 left-0 w-full z-20 flex justify-between items-center px-8 py-6 text-white">
    <div class="text-sm leading-tight">
      <div>One Page Partner</div>
      <div class="font-semibold">タビマエ・インバウンド</div>
    </div>

    <div class="flex items-center gap-4">
      <a href="#" class="bg-orange-500 hover:bg-orange-600 px-4 py-2 rounded-full text-sm font-semibold">
        無料資料請求する
      </a>
      <div class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center">
        ☰
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="relative w-full h-screen">
    <!-- Grid -->
    <div class="grid grid-cols-4 grid-rows-4 w-full h-full">
      <!-- 16枚画像 -->
      <img src="assets/images/hero_01.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_02.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_03.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_04.jpg" class="w-full h-full object-cover" />

      <img src="assets/images/hero_05.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_06.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_07.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_08.jpg" class="w-full h-full object-cover" />

      <img src="assets/images/hero_09.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_10.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_11.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_12.jpg" class="w-full h-full object-cover" />

      <img src="assets/images/hero_13.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_14.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_15.jpg" class="w-full h-full object-cover" />
      <img src="assets/images/hero_16.jpg" class="w-full h-full object-cover" />
    </div>
    <div class="absolute inset-0 z-[5]" style="background-color: rgba(31, 31, 31, 0.2);"></div>

    <!-- Overlay Text -->
    <div class="absolute inset-0 z-10 flex items-center justify-center px-5 md:px-8">
      <div class="text-white inline-block text-left" style="text-shadow: 0 4px 100px rgba(0, 0, 0, 0.25), 0 8px 24px rgba(0, 0, 0, 0.65), 0 0 2px rgba(0, 0, 0, 0.9);">
        <div class="text-2xl md:text-5xl font-medium leading-none mb-1">
          タビマエ<span style="color: #FF6957;">・</span>インバウンド
        </div>
        <div class="text-2xl md:text-4xl font-semibold leading-none mb-2 md:mb-3">
          by One Page Partner
        </div>

        <h1 class="text-5xl md:text-[76px] font-bold leading-[1.05] tracking-tight">
          インバウンド集客は
          <span style="color: #FF6957;">「旅前」</span>で決まる。
        </h1>
      </div>
    </div>
  </section>

</body>
</html>
